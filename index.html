<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyssal · Intent-classifier audits</title>
<meta name="description" content="Per-language audits and model cards for the Abyssal intent-classifier family. Every metric is computed in your browser from the raw per-call CSVs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#14171c;--muted:#5f6772;--line:#e3e6ea;--accent:#1f5eff;--accent-ink:#ffffff;
  --ok:#1a8f4d;--ok-bg:#e6f6ec;--bad:#c92a2a;--bad-bg:#fbe9e9;--warn:#b7791f;--warn-bg:#fdf3dc;--code:#eef1f5;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -12px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--panel:#171b21;--ink:#e8ebef;--muted:#98a2ad;--line:#262c34;--accent:#6b9bff;--accent-ink:#0b1020;
  --ok:#4cc38a;--ok-bg:#12301f;--bad:#ff6b6b;--bad-bg:#3a1717;--warn:#f0b64a;--warn-bg:#3a2d10;--code:#1f252d;}}
:root[data-theme="dark"]{
  --bg:#0f1216;--panel:#171b21;--ink:#e8ebef;--muted:#98a2ad;--line:#262c34;--accent:#6b9bff;--accent-ink:#0b1020;
  --ok:#4cc38a;--ok-bg:#12301f;--bad:#ff6b6b;--bad-bg:#3a1717;--warn:#f0b64a;--warn-bg:#3a2d10;--code:#1f252d;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
a{color:var(--accent)}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px}
nav.countries{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.countries a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--panel);font-weight:500}
nav.countries a.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero{padding:36px 0 8px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,3.4vw,36px);line-height:1.15;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero .sub{color:var(--muted);max-width:820px;margin:0}
.hero .lang{font-size:14px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:22px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .k{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:18px 0;overflow:hidden}
.card h2{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .hint{color:var(--muted);font-weight:400;font-size:13px}
.card .body{padding:14px 18px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;background:color-mix(in srgb,var(--panel) 70%,var(--bg))}
tr.primary td{font-weight:600}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
tr.selected td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.neutral{background:var(--code);color:var(--muted)}
.delta{font-size:12px;color:var(--muted);margin-left:6px}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.bars{display:grid;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:minmax(140px,220px) 1fr 64px;align-items:center;gap:10px;font-size:13.5px}
.bar .track{height:10px;background:var(--code);border-radius:999px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--accent);border-radius:999px}
.bar.base .fill{background:var(--muted);opacity:.55}
.bar .gate{position:absolute;top:-3px;width:2px;height:16px;background:var(--warn)}
.bar .n{text-align:right;color:var(--muted)}
.gates{display:flex;gap:8px;flex-wrap:wrap}
.gates .g{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;display:flex;gap:8px;align-items:center}
.gates .g.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-bg)}
.gates .g.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--bad-bg)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;min-width:180px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);border-bottom:none;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}
.tabs button.active{background:var(--panel);color:var(--ink);font-weight:600;border-color:var(--line);position:relative;top:1px}
.md{padding:8px 22px 22px;max-width:900px}
.md h1{font-size:24px}.md h2{font-size:19px;margin-top:28px}.md h3{font-size:16px}
.md pre{background:var(--code);padding:12px 14px;border-radius:10px;overflow:auto;font-size:13px}
.md code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
.md pre code{background:transparent;padding:0}
.md table{width:auto;font-size:13.5px}.md th,.md td{white-space:normal}
.md blockquote{border-left:3px solid var(--accent);margin:0;padding:4px 14px;color:var(--muted)}
.msg{white-space:normal;max-width:420px}
.small{font-size:12.5px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{color:var(--muted);font-size:13px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
details.howto summary{cursor:pointer;font-weight:600}
kbd{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.9em}
@media (max-width:640px){.bar{grid-template-columns:1fr 56px}.bar .track{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#"><span class="logo">🧭</span> Abyssal · Intent-classifier audits</a>
  <nav class="countries" id="nav"></nav>
</div></header>

<main class="wrap" id="app">
  <div class="empty"><span class="spinner"></span>Loading manifest…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
